# npm auth: trusted publishing (OIDC) only. Never add an NPM_TOKEN secret.
# npmjs.com -> each package -> Settings -> Trusted Publisher -> GitHub Actions:
#   owner/repo = i2mint/zodal, workflow filename = ci.yml, no environment.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to a PR cancels the older run. Every push to main gets its own group (keyed
# by sha), so a main run is never cancelled by the next push: cancelling one between
# `pnpm -r publish` and tagging left a version on npm with no verification and no tag.
# The publish job below has its own non-cancelling group so releases never overlap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

      # Would releasing these versions break a published satellite's peer range?
      # Fails only on a NEW exclusion; satellites that already exclude the published
      # version are reported as warnings (--strict makes them errors).
      - name: Satellite peer ranges
        run: node scripts/check-satellite-peers.mjs ${{ github.event_name == 'pull_request' && '--network-errors-warn' || '' }}

  gate:
    name: Release gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.subject.outputs.publish }}
      force: ${{ steps.subject.outputs.force }}

    steps:
      - uses: actions/checkout@v6

      # Only the commit SUBJECT (first line) may arm a release. The previous gate matched the
      # whole commit message, so a commit that merely *mentioned* the marker in its body --
      # such as one documenting this very workflow -- published to npm for real.
      #
      # The subject is read with git rather than interpolated from the event payload, so an
      # arbitrary commit message can never be spliced into this shell.
      - id: subject
        run: |
          set -euo pipefail
          subject=$(git log -1 --pretty=%s)
          publish=false
          force=false
          case "$subject" in
            *'[force publish]'*) publish=true; force=true ;;
            *'[publish]'*)       publish=true ;;
          esac
          echo "subject: $subject"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "force=$force" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    needs: [validate, gate]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Releases never overlap and a running one is never cancelled. Only an armed release joins
    # the shared group: a run whose publish job is skipped gets a group of its own, so it can
    # never take the single pending slot from a release that is waiting its turn.
    concurrency:
      group: ${{ needs.gate.outputs.publish == 'true' && format('npm-publish-{0}', github.repository) || format('no-publish-{0}', github.run_id) }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Ensure npm >= 11.5.1 (required for OIDC trusted publishing)
        run: |
          if ! node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"; then
            npm install -g npm@^11.5.1
          fi
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Re-running an older main run (its release cancelled or failed after a newer one shipped)
      # would publish the older version as `latest` and move npm's default install back to it.
      # Anything older than what `latest` points at today goes out under `backport` instead.
      # A package not on the registry yet (first release) has no `latest` and publishes normally.
      - name: Choose the npm dist-tag
        id: disttag
        run: |
          set -euo pipefail
          older_than() {  # exit 0 when semver $1 < $2 (a prerelease sorts before its release)
            node -e 'const p=v=>{const [core,pre]=v.split("+")[0].split(/-(.*)/s);return [...core.split(".").map(Number),pre]};const [a,b]=process.argv.slice(1).map(p);for(let i=0;i<3;i++){if(a[i]!==b[i])process.exit(a[i]<b[i]?0:1)}process.exit(a[3]!==undefined&&b[3]===undefined?0:1)' "$1" "$2"
          }
          tag=latest
          while IFS=$'\t' read -r name version; do
            # Only a 404 means "not on the registry yet"; any other failure stops the release
            # rather than guess, since guessing `latest` is the bug this step prevents.
            if ! current=$(npm view "$name" dist-tags.latest 2>"$RUNNER_TEMP/npm-view.err"); then
              grep -q E404 "$RUNNER_TEMP/npm-view.err" || { cat "$RUNNER_TEMP/npm-view.err"; exit 1; }
              current=""
            fi
            if [ -n "$current" ] && older_than "$version" "$current"; then
              echo "::warning::${name}@${version} is older than npm's latest (${current}): publishing under the 'backport' dist-tag"
              tag=backport
            fi
          done < <(pnpm -r ls --depth -1 --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const p of JSON.parse(s))if(!p.private)console.log(p.name+"\t"+p.version)})')
          echo "dist-tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish packages
        env:
          FORCE_PUBLISH: ${{ needs.gate.outputs.force }}
          DIST_TAG: ${{ steps.disttag.outputs.tag }}
        run: |
          set -euo pipefail
          FORCE=""
          if [ "$FORCE_PUBLISH" = "true" ]; then
            FORCE="--no-git-checks"
          fi
          # No `|| true` here. A failed auth makes the registry answer 404 to the
          # PUT, and swallowing that exit code reported the whole run as green while npm
          # stayed on the previous version — the failure mode this step now refuses.
          # `pnpm -r publish` already skips a version the registry has, so re-running a
          # publish stays idempotent without hiding errors.
          pnpm -r publish --access public --provenance --tag "$DIST_TAG" $FORCE

      # A publish is only real if the registry serves it. Ask the registry, don't infer it
      # from an exit code.
      - name: Verify the registry serves this version
        run: |
          set -euo pipefail
          VERSION=$(node -e "console.log(require('./packages/core/package.json').version)")
          for pkg in core store ui; do
            # Give the registry a moment: a newly published version takes some seconds to
            # become readable, so checking immediately false-negatives on a publish that
            # actually worked (it did, on zodal-store-http's first release). Retry, then
            # fail for real.
            confirmed=""
            for attempt in $(seq 1 10); do
              got=$(npm view "@zodal/${pkg}@${VERSION}" version 2>/dev/null || true)
              if [ "$got" = "$VERSION" ]; then
                echo "@zodal/${pkg}@${VERSION} confirmed on the registry (attempt ${attempt})"
                confirmed=1
                break
              fi
              echo "@zodal/${pkg}@${VERSION} not visible yet (attempt ${attempt}/10)"
              sleep 15
            done
            if [ -z "$confirmed" ]; then
              echo "::error::@zodal/${pkg}@${VERSION} never appeared on the registry — the publish failed."
              exit 1
            fi
          done

      - name: Configure SSH for git push
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git remote set-url origin git@github.com:${{ github.repository }}.git

      # Tag the published version. An existing remote tag is fine (a re-run, or a version that
      # was already on npm and tagged by the run that published it); any other push failure
      # (key, permissions, network) fails the run instead of leaving a version with no tag.
      - name: Tag release
        run: |
          set -euo pipefail
          VERSION=$(node -e "console.log(require('./packages/core/package.json').version)")
          TAG="v${VERSION}"
          remote=$(git ls-remote --tags origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}")
          if [ -n "$remote" ]; then
            # An annotated tag lists its commit on the peeled `^{}` line.
            tagged=$(echo "$remote" | awk '$2 ~ /\^\{\}$/ {print $1}')
            [ -n "$tagged" ] || tagged=$(echo "$remote" | awk '{print $1; exit}')
            if [ "$tagged" = "$(git rev-parse HEAD)" ]; then
              echo "${TAG} already tagged at this commit"
            else
              echo "::warning::${TAG} already exists at ${tagged}, not at this commit: kept as is (that run published ${VERSION})"
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
